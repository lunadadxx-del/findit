name: findit
description: "FindIt — smartphone object-finding assistant for blind and low-vision users. On-device camera detection with closed-loop voice and haptic guidance."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Camera capture + image stream for the detection pipeline.
  camera: ">=0.11.0 <0.12.1"
  # On-device TFLite inference (no cloud, no internet needed).
  tflite_flutter: ^0.12.1
  # On-device text-to-speech for voice guidance (Android TextToSpeech).
  flutter_tts: ^4.2.5
  # Haptic / vibration feedback for proximity guidance.
  vibration: ^3.2.1
  # Voice input ("find my bottle") via Android SpeechRecognizer.
  speech_to_text: ^7.4.0
  # Runtime permission requests (camera, microphone).
  permission_handler: ^12.0.1
  shared_preferences: 2.5.6
  google_generative_ai: 0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/detect.tflite
    - assets/models/labelmap.txt
